name: APK probe
on:
  push:
    branches: [arena/4ad620d6-something]
    paths-ignore:
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify real APK was fetched
        run: |
          ls -lh Minecraft.apk
          test "$(stat -c %s Minecraft.apk)" -gt 100000000 || {
            echo "LFS object did not download"; head -c 200 Minecraft.apk; exit 1;
          }
          sha256sum Minecraft.apk

      - name: APK structure report
        run: python3 scripts/apk_probe.py

      - name: Extract MCPELIFE client files
        run: python3 scripts/apk_client_extract.py

      - name: Hunt for hidden / obfuscated modules
        run: python3 scripts/apk_module_hunt.py

      - name: Decompile injected client classes (jadx)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -e
          URL=$(python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/skylot/jadx/releases/latest",
                                       headers={"User-Agent": "arena-apk-probe"})
          d = json.load(urllib.request.urlopen(req))
          print(next(a["browser_download_url"] for a in d["assets"]
                     if a["name"].startswith("jadx") and a["name"].endswith(".zip")))
          PY
          )
          echo "jadx: $URL"
          curl -sSL "$URL" -o /tmp/jadx.zip
          unzip -q -o /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          java -version
          mkdir -p /tmp/jadx-out
          for dex in research/client/dex/*.dex; do
            name=$(basename "$dex" .dex)
            echo "decompiling $name"
            /tmp/jadx/bin/jadx --no-res --threads-count 2 -d "/tmp/jadx-out/$name" "$dex" > "/tmp/$name.log" 2>&1 || tail -5 "/tmp/$name.log"
          done
          mkdir -p research/client/jadx
          find /tmp/jadx-out -type f -name '*.java' -path '*/sources/com/mojang/minecraftpe/mcpelife/*' | while read -r f; do
            dest="research/client/jadx/${f#*/sources/}"
            mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"
          done
          grep -rl -E 'MCPELIFE\.json|libMCPELIFE|mcpelife/|MCPELIFE0|Hidden0|special_clinit_' /tmp/jadx-out --include='*.java' 2>/dev/null | awk 'NR <= 120' | while read -r f; do
            dest="research/client/jadx/${f#*/sources/}"
            mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"
          done
          # MCPELIFE0 is the native-loader/registration package imported by
          # every obfuscated class; keep it even if it has no obvious keywords.
          find /tmp/jadx-out/ -type f -name '*.java' -path '*/sources/MCPELIFE0/*' | while read -r f; do
            dest="research/client/jadx/${f#*/sources/}"
            mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"
          done
          echo "decompiled files copied: $(find research/client/jadx -type f | wc -l)"
          echo "client loader Java files:"; find research/client/jadx/MCPELIFE0 -type f -maxdepth 3 -print 2>/dev/null || true

      - name: Native binary metadata
        run: |
          mkdir -p research/client/native
          readelf -h -d -Ws research/client/lib/arm64-v8a/libMCPELIFE.so > research/client/native/readelf.txt
          strings -a -n 4 research/client/lib/arm64-v8a/libMCPELIFE.so > research/client/native/strings.txt
          objdump -T research/client/lib/arm64-v8a/libMCPELIFE.so > research/client/native/dynsymbols.txt 2>&1 || true
          python3 - <<'PY'
          import json, re
          p='research/client/native/strings.txt'
          ss=open(p, errors='replace').read().splitlines()
          rx=re.compile(r'(?i)(mcpelife|mcpe|module|xray|x-ray|esp|aura|cheat|hack|hook|inject|offset|decrypt|encrypt|asset|\.so|\.json|http|https|jni|native|class|method|register|loadlibrary|texture|shader|render|entity|player|block|world|version|key|menu|float|gl[A-Z])')
          hits=[s for s in ss if rx.search(s)]
          open('research/client/native/interesting-strings.txt','w').write('\n'.join(hits)+'\n')
          print('native strings:',len(ss),'interesting:',len(hits))
          PY

      - name: Ghidra targeted native decompile
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p /tmp/ghidra-download research/client/native/ghidra
          curl --fail --location --retry 3 --output /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra-download
          GHIDRA_DIR=$(find /tmp/ghidra-download -maxdepth 1 -type d -name 'ghidra_*' | head -1)
          test -n "$GHIDRA_DIR"
          mkdir -p /tmp/ghidra-project
          set +e
          "$GHIDRA_DIR/support/analyzeHeadless" /tmp/ghidra-project MCPELIFE \
            -import research/client/lib/arm64-v8a/libMCPELIFE.so \
            -scriptPath scripts \
            -postScript GhidraNativeScan.java "$GITHUB_WORKSPACE/research/client/native/ghidra" \
            > /tmp/ghidra-headless.log 2>&1
          ghidra_status=$?
          tail -120 /tmp/ghidra-headless.log
          cp /tmp/ghidra-headless.log research/client/native/ghidra/ghidra-headless.log
          printf 'Ghidra exit status: %s\n' "$ghidra_status" > research/client/native/ghidra/status.txt
          exit "$ghidra_status"

      - name: Commit findings back to branch
        run: |
          git config user.name "arena-apk-probe"
          git config user.email "arena-apk-probe@users.noreply.github.com"
          git add research/ scripts/
          if git diff --cached --quiet; then
            echo "No report changes"; exit 0;
          fi
          git commit -m "Add MCPELIFE client extraction and hidden-module analysis"
          git push origin HEAD:arena/4ad620d6-something
